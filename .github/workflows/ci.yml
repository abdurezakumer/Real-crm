name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Compile Python modules
        run: python -m compileall -q realestate_crm api scripts tests
      - name: Run unit tests
        run: python -m pytest -q
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
